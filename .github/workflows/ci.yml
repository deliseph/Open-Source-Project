name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
        os: [ubuntu-latest]
        # Exports arrive on every platform, so the ZIP and path handling has
        # to be checked on Windows and macOS too — on one Node version.
        include:
          - node: "22"
            os: windows-latest
          - node: "22"
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: node dist/cli.js platforms

  privacy:
    name: No network access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The core promise of the project. If any of these land in src/, it needs
      # to be a deliberate, documented, opt-in decision — see CONTRIBUTING.md.
      - name: Assert no HTTP client in source
        run: |
          if grep -rnE "\b(fetch|XMLHttpRequest|WebSocket)\s*\(|require\(['\"](https?|node:https?)['\"]\)|from ['\"]node:https?['\"]" src/; then
            echo "::error::Network call found in src/. Archivore must not make network requests."
            exit 1
          fi
          echo "No network calls in src/."

      - name: Assert no runtime dependency creep
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          echo "Runtime dependencies: $count"
          if [ "$count" -gt 1 ]; then
            echo "::error::More than one runtime dependency. Discuss in an issue first."
            exit 1
          fi

      - name: Audit
        run: npm audit --audit-level=moderate
